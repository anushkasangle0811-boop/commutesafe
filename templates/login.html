<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CommuteSafe</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root {
      --cs-purple-50:  #F5F3FF;
      --cs-purple-100: #EDE9FE;
      --cs-purple-200: #DDD6FE;
      --cs-purple-500: #8B5CF6;
      --cs-purple-600: #7C3AED;
      --cs-purple-700: #6D28D9;
      --cs-purple-900: #4C1D95;
      --cs-pink-500: #EC4899;
      --cs-pink-600: #DB2777;
      --cs-danger:   #DC2626;
      --cs-danger-soft: #FEE2E2;
      --cs-bg:       #F7F7FB;
      --cs-surface:  #FFFFFF;
      --cs-border:   #E5E7EB;
      --cs-text:     #1F2937;
      --cs-muted:    #6B7280;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-lg: 0 10px 25px -5px rgba(124,58,237,.15), 0 8px 10px -6px rgba(124,58,237,.08);
      --transition: 180ms cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--cs-purple-50) 0%, #FDF2F8 100%);
      color: var(--cs-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    a { color: inherit; text-decoration: none; }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--cs-surface);
      border: 1px solid var(--cs-border);
      border-radius: var(--radius-lg);
      padding: 40px 38px;
      box-shadow: var(--shadow-lg);
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand__logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cs-purple-600), var(--cs-pink-500));
      display: grid; place-items: center;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 6px 16px rgba(124,58,237,.35);
      margin-bottom: 14px;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--cs-purple-900);
    }

    .auth-brand span {
      font-size: 12px;
      color: var(--cs-muted);
      margin-top: 2px;
    }

    h2.auth-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: var(--cs-text);
      margin: 0 0 24px;
    }

    .error-message {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--cs-danger-soft);
      color: #991B1B;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 20px;
      border: 1px solid #FECACA;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--cs-text);
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cs-purple-500);
      font-size: 16px;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--cs-border);
      border-radius: 10px;
      font-size: 14.5px;
      color: var(--cs-text);
      background: var(--cs-bg);
      transition: all var(--transition);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--cs-purple-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139,92,246,.15);
    }

    .input-wrap input::placeholder { color: #9CA3AF; }

    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cs-purple-600), var(--cs-purple-700));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(124,58,237,.3);
      transition: all var(--transition);
      margin-top: 4px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(124,58,237,.4);
    }

    .switch-box {
      margin-top: 22px;
      padding: 14px;
      background: linear-gradient(135deg, var(--cs-purple-50), #FDF2F8);
      border: 1px solid var(--cs-purple-100);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 13.5px;
      color: var(--cs-muted);
    }

    .switch-box a {
      color: var(--cs-purple-700);
      font-weight: 700;
    }

    .switch-box a:hover { text-decoration: underline; }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--cs-muted);
    }

    .home-link:hover { color: var(--cs-purple-600); }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-brand__logo">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1>COMMUTESAFE</h1>
      <span>Women's Safety Platform</span>
    </div>

    <h2 class="auth-title">Welcome Back</h2>

    {% if error %}
    <div class="error-message">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST">

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i class="bi bi-envelope-fill"></i>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>

    </form>

    <div class="switch-box">
      Don't have an account? <a href="/register">Register</a>
    </div>

    <a href="/" class="home-link">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>

  </div>

</body>
</html>
