<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nearby Medical Stores · CommuteSafe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root {
    --cs-purple-50:  #F5F3FF;
    --cs-purple-100: #EDE9FE;
    --cs-purple-200: #DDD6FE;
    --cs-purple-500: #8B5CF6;
    --cs-purple-600: #7C3AED;
    --cs-purple-700: #6D28D9;
    --cs-purple-900: #4C1D95;

    --cs-pink-50:  #FDF2F8;
    --cs-pink-500: #EC4899;
    --cs-pink-600: #DB2777;

    --cs-danger:   #DC2626;
    --cs-danger-soft: #FEE2E2;
    --cs-success:  #059669;
    --cs-success-soft: #D1FAE5;
    --cs-warning:  #D97706;
    --cs-warning-soft: #FEF3C7;
    --cs-info:     #2563EB;
    --cs-info-soft:#DBEAFE;

    --cs-bg:       #F7F7FB;
    --cs-surface:  #FFFFFF;
    --cs-border:   #E5E7EB;
    --cs-text:     #1F2937;
    --cs-muted:    #6B7280;
    --cs-soft:     #9CA3AF;

    --accent-600: var(--cs-purple-600);
    --accent-500: var(--cs-purple-500);
    --accent-50:  var(--cs-purple-50);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--cs-purple-50) 0%, var(--cs-pink-50) 100%);
    color: var(--cs-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    background: var(--cs-surface);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(76, 29, 149, 0.12);
    width: 100%;
    max-width: 460px;
    padding: 40px 32px 32px;
    text-align: center;
  }

  .card__icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent-600), var(--cs-pink-500));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(124, 58, 237, 0.3);
  }
  .card__icon i { font-size: 32px; color: #fff; }

  .card__title {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 800;
    color: var(--cs-purple-900);
  }

  .card__desc {
    margin: 0 0 28px;
    color: var(--cs-muted);
    font-size: 15px;
    line-height: 1.5;
  }

  .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 14px;
    color: var(--cs-text);
    margin-bottom: 8px;
    text-align: left;
  }
  .field-label i { color: var(--accent-600); font-size: 15px; }

  .locate-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1.5px dashed var(--cs-purple-200);
    background: var(--accent-50);
    color: var(--accent-600);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s ease, border-color .15s ease;
    margin-bottom: 24px;
  }
  .locate-btn:hover { background: var(--cs-purple-100); border-color: var(--accent-500); }
  .locate-btn:disabled { opacity: .6; cursor: not-allowed; }
  .locate-btn i.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-msg {
    font-size: 14px;
    margin: -12px 0 20px;
    min-height: 18px;
  }
  .status-msg.error { color: var(--cs-danger); }
  .status-msg.muted { color: var(--cs-muted); }

  .results {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
    text-align: left;
  }

  .result-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--cs-border);
    border-radius: 14px;
    background: #FCFCFF;
  }
  .result-card__icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--accent-50);
    color: var(--accent-600);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .result-card__body { flex: 1; min-width: 0; }
  .result-card__name {
    font-weight: 700;
    font-size: 15px;
    color: var(--cs-text);
    margin: 0 0 2px;
  }
  .result-card__meta {
    font-size: 13px;
    color: var(--cs-muted);
    margin: 0 0 10px;
  }
  .result-card__link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-600);
    text-decoration: none;
  }
  .result-card__link:hover { text-decoration: underline; }

  .info-box {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    text-align: left;
    background: var(--accent-50);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 24px;
    font-size: 13.5px;
    color: var(--cs-muted);
    line-height: 1.5;
  }
  .info-box i { color: var(--accent-600); font-size: 16px; margin-top: 1px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--cs-muted);
    text-decoration: none;
    font-size: 14px;
  }
  .back-link:hover { color: var(--cs-text); }
</style>
</head>
<body>

  <div class="card">
    <div class="card__icon"><i class="bi bi-capsule"></i></div>
    <h1 class="card__title">Nearby Medical Stores</h1>
    <p class="card__desc">Find pharmacies close to your current location to get medicines quickly.</p>

    <div class="field-label"><i class="bi bi-geo-alt-fill"></i> Your Current Location</div>
    <button type="button" class="locate-btn" id="locateBtn">
      <i class="bi bi-crosshair"></i>
      <span id="locateLabel">Use My Current Location</span>
    </button>

    <p class="status-msg muted" id="statusMsg"></p>

    <div class="results" id="results"></div>

    <div class="info-box">
      <i class="bi bi-info-circle-fill"></i>
      <span>Results come from OpenStreetMap data and are sorted by distance. Store hours may vary, so consider calling ahead for urgent needs.</span>
    </div>

    <a href="{{ url_for('dashboard') }}" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
  </div>

<script>
  const AMENITY = 'pharmacy';
  const RADIUS_M = 4000;

  const locateBtn = document.getElementById('locateBtn');
  const locateLabel = document.getElementById('locateLabel');
  const statusMsg = document.getElementById('statusMsg');
  const resultsEl = document.getElementById('results');

  function setStatus(text, type) {
    statusMsg.textContent = text || '';
    statusMsg.className = 'status-msg ' + (type || 'muted');
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function getCurrentPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Geolocation is not supported by your browser.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        (err) => {
          let msg = 'Unable to retrieve your location.';
          if (err.code === err.PERMISSION_DENIED) msg = 'Location access denied. Please allow location access and try again.';
          else if (err.code === err.POSITION_UNAVAILABLE) msg = 'Location unavailable right now.';
          else if (err.code === err.TIMEOUT) msg = 'Location request timed out. Please try again.';
          reject(new Error(msg));
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  async function fetchNearby(lat, lng) {
    const query = `
      [out:json][timeout:15];
      node["amenity"="${AMENITY}"](around:${RADIUS_M},${lat},${lng});
      out body ${AMENITY === 'pharmacy' ? 40 : 20};
    `;
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query
    });
    if (!res.ok) throw new Error('Unable to fetch nearby places right now.');
    const data = await res.json();
    return (data.elements || [])
      .filter(el => el.tags && el.tags.name)
      .map(el => ({
        name: el.tags.name,
        lat: el.lat,
        lng: el.lon,
        address: [el.tags['addr:street'], el.tags['addr:city']].filter(Boolean).join(', '),
        distanceKm: haversine(lat, lng, el.lat, el.lon)
      }))
      .sort((a, b) => a.distanceKm - b.distanceKm)
      .slice(0, 10);
  }

  function renderResults(places, originLat, originLng) {
    resultsEl.innerHTML = '';
    if (!places.length) {
      setStatus('No medical stores found nearby. Try again from a different location.', 'muted');
      return;
    }
    setStatus(`Found ${places.length} medical store${places.length > 1 ? 's' : ''} near you.`, 'muted');

    places.forEach(place => {
      const card = document.createElement('div');
      card.className = 'result-card';
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${originLat},${originLng}&destination=${place.lat},${place.lng}`;
      card.innerHTML = `
        <div class="result-card__icon"><i class="bi bi-capsule"></i></div>
        <div class="result-card__body">
          <p class="result-card__name">${place.name}</p>
          <p class="result-card__meta">${place.distanceKm.toFixed(1)} km away${place.address ? ' · ' + place.address : ''}</p>
          <a class="result-card__link" href="${mapsUrl}" target="_blank" rel="noopener">
            <i class="bi bi-signpost-split-fill"></i> Get Directions
          </a>
        </div>
      `;
      resultsEl.appendChild(card);
    });
  }

  locateBtn.addEventListener('click', async () => {
    locateBtn.disabled = true;
    locateLabel.textContent = 'Locating...';
    locateBtn.querySelector('i').className = 'bi bi-arrow-repeat spin';
    resultsEl.innerHTML = '';
    setStatus('Getting your current location...', 'muted');

    try {
      const pos = await getCurrentPosition();
      setStatus('Searching nearby medical stores...', 'muted');
      const places = await fetchNearby(pos.lat, pos.lng);
      renderResults(places, pos.lat, pos.lng);
    } catch (err) {
      setStatus(err.message, 'error');
    } finally {
      locateBtn.disabled = false;
      locateLabel.textContent = 'Use My Current Location';
      locateBtn.querySelector('i').className = 'bi bi-crosshair';
    }
  });
</script>
</body>
</html>
