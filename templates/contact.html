<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trusted Contact | CommuteSafe</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root {
      --cs-purple-50:  #F5F3FF;
      --cs-purple-100: #EDE9FE;
      --cs-purple-500: #8B5CF6;
      --cs-purple-600: #7C3AED;
      --cs-purple-700: #6D28D9;
      --cs-purple-900: #4C1D95;
      --cs-pink-500: #EC4899;
      --cs-bg: #F7F7FB;
      --cs-surface: #FFFFFF;
      --cs-border: #E5E7EB;
      --cs-text: #1F2937;
      --cs-muted: #6B7280;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-lg: 0 10px 25px -5px rgba(124,58,237,.15), 0 8px 10px -6px rgba(124,58,237,.08);
      --transition: 180ms cubic-bezier(.4,0,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--cs-purple-50) 0%, #FDF2F8 100%);
      color: var(--cs-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    a { color: inherit; text-decoration: none; }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--cs-surface);
      border: 1px solid var(--cs-border);
      border-radius: var(--radius-lg);
      padding: 36px 34px;
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .card-header__icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cs-purple-600), var(--cs-pink-500));
      display: grid; place-items: center;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 6px 16px rgba(124,58,237,.35);
      margin-bottom: 14px;
    }
    .card-header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; color: var(--cs-purple-900); }
    .card-header p { margin: 0; font-size: 13.5px; color: var(--cs-muted); line-height: 1.5; }

    .field { margin-bottom: 18px; }
    .field label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--cs-text);
      margin-bottom: 8px;
    }
    .field label i { color: var(--cs-purple-600); }

    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--cs-purple-500); font-size: 16px;
    }
    .input-wrap input {
      width: 100%; height: 48px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--cs-border); border-radius: 10px;
      font-size: 14.5px; color: var(--cs-text);
      background: var(--cs-bg);
      transition: all var(--transition);
    }
    .input-wrap input:focus {
      outline: none; border-color: var(--cs-purple-500); background: #fff;
      box-shadow: 0 0 0 3px rgba(139,92,246,.15);
    }
    .field-hint {
      font-size: 11.5px; color: var(--cs-muted); margin-top: 6px;
    }

    .btn-primary {
      width: 100%; height: 50px;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--cs-purple-600), var(--cs-purple-700));
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(124,58,237,.3);
      transition: all var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 4px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(124,58,237,.4); }

    .back-link {
      display: block; text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--cs-muted);
    }
    .back-link:hover { color: var(--cs-purple-600); }

    @media (max-width: 480px) { .card { padding: 28px 22px; } }
  </style>
</head>
<body>

  <div class="card">

    <div class="card-header">
      <div class="card-header__icon"><i class="bi bi-person-plus-fill"></i></div>
      <h1>Add Trusted Contact</h1>
      <p>Add a person who will receive your journey and SOS alerts.</p>
    </div>

    <form method="POST">

      <div class="field">
        <label for="name"><i class="bi bi-person-fill"></i> Name</label>
        <div class="input-wrap">
          <i class="bi bi-person-fill"></i>
          <input type="text" id="name" name="name" placeholder="Enter contact name" required>
        </div>
      </div>

      <div class="field">
        <label for="phone"><i class="bi bi-telephone-fill"></i> Phone</label>
        <div class="input-wrap">
          <i class="bi bi-telephone-fill"></i>
          <input type="text" id="phone" name="phone" placeholder="+91XXXXXXXXXX" required>
        </div>
        <div class="field-hint">Include country code, e.g. +919876543210</div>
      </div>

      <div class="field">
        <label for="email"><i class="bi bi-envelope-fill"></i> Email</label>
        <div class="input-wrap">
          <i class="bi bi-envelope-fill"></i>
          <input type="email" id="email" name="email" placeholder="Enter contact email" required>
        </div>
        <div class="field-hint">Journey and SOS alerts are sent to this email</div>
      </div>

      <div class="field">
        <label for="relation"><i class="bi bi-heart-fill"></i> Relation</label>
        <div class="input-wrap">
          <i class="bi bi-heart-fill"></i>
          <input type="text" id="relation" name="relation" placeholder="e.g. Mother, Father, Friend">
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <i class="bi bi-check-circle-fill"></i> Save Contact
      </button>

    </form>

    <a href="/dashboard" class="back-link"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>

  </div>

</body>
</html>
